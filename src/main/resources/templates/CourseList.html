<header>
    <div class="page-header"></div>
</header>
<div class="text-center error-message p-3 mb-2 bg-danger text-white" hidden> </div>
<div class="text-center success-message p-3 mb-2 bg-success text-white" hidden> </div>
<main hidden>
    <div class="container py-5">
        <div class="row mb-3">
            <h2 class="col">Courses</h2>
            <div class="col-1">
                <button class="btn manager-view" id="create-course" hidden><i class="fa fa-plus"></i></button>
            </div>
        </div>
        <div class="d-flex flex-wrap" id="courses-container">
            <div id="course-list-message"></div>
            <template id="course-template" class="hidden">
                <div class="col-4 p-2">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">Blockchain</h4>
                            <div class="card-text">
                                <p class="course-start-date"></p>
                                <p class="course-end-date"></p>
                            </div>
                            <a class="course-name btn btn-primary">Enter</a>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</main>
