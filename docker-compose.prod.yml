version: '3.5'

volumes:
  datavolume:
    driver: local


services:
  db:
    image: harbourspace/private:testing-platform-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD outside source control}
      - POSTGRES_USER=${DB_USERNAME:?Set DB_USERNAME outside source control}
      - POSTGRES_DB=postgres
    volumes:
    - datavolume:/data

  testing-platform:
    environment:
      - DB_USERNAME=${DB_USERNAME:?Set DB_USERNAME outside source control}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD outside source control}
      - MAIL_USERNAME=${MAIL_USERNAME:?Set MAIL_USERNAME outside source control}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?Set MAIL_PASSWORD outside source control}
      - MAIL_FROM=${MAIL_FROM:?Set MAIL_FROM outside source control}
      - SPHERE_PROBLEMS_TOKEN=${SPHERE_PROBLEMS_TOKEN:?Set SPHERE_PROBLEMS_TOKEN outside source control}
      - SPHERE_COMPILERS_TOKEN=${SPHERE_COMPILERS_TOKEN:?Set SPHERE_COMPILERS_TOKEN outside source control}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:?Set SENDGRID_API_KEY outside source control}
    image: harbourspace/private:testing-platform
    restart: always
    ports:
      - "8081:8081"
    links:
      - db
    depends_on:
      - db

