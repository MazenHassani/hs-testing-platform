<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Send an Email</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.1/css/bulma.min.css">
    <script defer src="https://use.fontawesome.com/releases/v5.14.0/js/all.js"></script>
</head>

<body>
    <section class="hero is-medium is-primary is-bold">
        <div class="hero-body">
            <div class="container">
                <div class="columns is-centered">
                    <div class="column is-8">
                        <h1 class="title">
                            We can send an email for you
                        </h1>
                        <h2 class="subtitle">
                            Primary bold subtitle
                        </h2>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-8">
                    <form action="/api/mail/send" method="POST">
                        <div class="field">
                            <label class="label">Subject</label>
                            <div class="control">
                                <input class="input" type="text" placeholder="Text input" name="subject">
                            </div>
                        </div>
            
                        <div class="field">
                            <label class="label">To</label>
                            <div class="control has-icons-left has-icons-right">
                                <input class="input" type="email" placeholder="Email input" value="mazen.hs93@gmail.com" name="to">
                                <span class="icon is-small is-left">
                                    <i class="fas fa-envelope"></i>
                                </span>
                            </div>
                        </div>
            
                        <div class="field">
                            <label class="label">Message</label>
                            <div class="control">
                                <textarea class="textarea" placeholder="Textarea" name="message"></textarea>
                            </div>
                        </div>
            
                        <div class="field is-grouped">
                            <div class="control">
                                <button class="button is-link">Send</button>
                            </div>
                            <!-- <div class="control">
                                    <button class="button is-link is-light">Cancel</button>
                                </div> -->
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <script>
        async function sendMail(RawSubmissionRequest) {
            const response = await fetch(`/api/scoreboard/add`, {
                method: 'POST',
                mode: "same-origin",
                credentials: "same-origin",
                cache: "default",
                headers: {
                    "content-type": "application/json",
                    'Authorization': 'Bearer ' + (keycloak.token || loginToken),
                    'Accept': 'application/json',
                },
                body: JSON.stringify(RawSubmissionRequest),
                redirect: "follow",
            });
            if (!response.ok) {
                alert(`Failed to submit code, Status code: ${response.status}`);
            }
            return false;
        }
    </script>
</body>

</html>
