    />
    <script

<body>
<!--[if lt IE 7]>
<p class="browsehappy">

    experience.

<header>
    <div class="page-header"></div>
</header>
<div class="text-center error-message p-3 mb-2 bg-danger text-white" hidden> </div>
<div class="text-center success-message p-3 mb-2 bg-success text-white" hidden> </div>
<main hidden>
    <div class="py-5 container">
        <div class="col-sm-6 form-group-lg mx-auto">
            <span id="course-id" hidden></span>
            <h3 class="mb-3 text-center" id="course-name"></h3>
            <h4 class="mb-3 text-center">Invite Participants</h4>
            <form id="submitForm">
                <div class="form-row mb-3">
                    <label for="invite-students">Students email(s)</label>
                    <textarea
                            type="textbox"
                            rows="7"
                            class="form-control"
                            id="invite-students"
                            placeholder=""
                            value=""
                    ></textarea>
                </div>
                <div class="form-row mb-3">
                    <label for="invite-teachers">Teachers email(s)</label>
                    <textarea
                            type="textbox"
                            rows="7"
                            class="form-control"
                            id="invite-teachers"
                            placeholder=""
                            value=""
                    ></textarea>
                </div>
                <div class="form-row mb-2">
                    <button class="btn btn-success btn-block" id="create-invite" type="submit">Invite</button>
                </div>
                <div class="form-row mb-2">
                    <button onclick="goBack()" class="btn btn-secondary btn-block" type="submit">Cancel</button>
                </div>
            </form>
            <div id="invites" hidden>
                <div id="teachers-invites">
                    <p>Teacher invites:</p>
                </div>
                <div id="students-invites">
                    <p>Student invites:</p>
                </div>
                <template id="invite-template" class="hidden">
                    <p><a class="invite-link"></a></p>
                </template>
            </div>
        </div>
    </div>
</main>
<script>
    const courseId = "[[${courseId}]]";
</script>
<script src="https://dev.harbour.space:8443/auth/js/keycloak.js"></script>
<script src="/js/util.js" defer></script>
<script src="/js/CreateInvite.js" defer></script>
</body>
</html>
