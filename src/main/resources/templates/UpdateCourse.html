<header>
    <div class="page-header"></div>
</header>
<div class="text-center error-message p-3 mb-2 bg-danger text-white" hidden></div>
<div class="text-center success-message p-3 mb-2 bg-success text-white" hidden> </div>
<main hidden>
    <div class="container py-5">
        <div class="col-sm-6 form-group-lg mx-auto">
            <h4 class="mb-3 text-center" id="page_function">Create Course</h4>
            <form id="submitForm" class="align-items-center">
                <div class="form-row mb-2">
                    <label for="course-name">Course Name</label>
                    <input type="text" class="form-control mr-2" id="course-name" name="course-name" required/>
                </div>

                <div class="form-row mb-2">
                    <div class="col">
                        <div class="form-row mt-2">
                            <label for="course-start-date">Starts on</label>
                        </div>
                        <div class="form-row">
                            <input type="date" id="course-start-date" class="form-control mb-2 mr-2"
                                   name="course-start-date" required/>
                            <input type="time" id="course-start-time" class="form-control mb-2 mr-2"
                                   name="course-start-time" required/>
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-row mt-2">
                            <label for="course-end-date">Ends on</label>
                        </div>
                        <div class="form-row">
                            <input type="date" id="course-end-date" class="form-control mb-2 mr-2"
                                   name="course-end-date" required/>
                            <input type="time" id="course-end-time" class="form-control mb-2 mr-2"
                                   name="course-end-time" required/>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <button id="save-course" class="col btn btn-success btn-block mt-2 mr-2" type="submit">Create
                    </button>
                    <button id="delete-course" class="col btn btn-danger btn-block mt-2 mr-2" hidden>Delete</button>
                    <button onclick="goBack()" class="col btn btn-secondary btn-block mt-2">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
    const courseId = "[[${courseId}]]";
</script>
