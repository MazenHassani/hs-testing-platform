<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HS Stars | Manage Test Questions</title>

    <script src="https://SortableJS.github.io/Sortable/Sortable.js"></script>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"
            integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
            integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
            integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .list-group .list-group-item:hover {
            background-color: #f7f7f7;
        }
    </style>
</head>
<body>
<!--[if lt IE 7]>
<p class="browsehappy">
    You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your
    experience.
</p>
<![endif]-->

<header>
    <div class="page-header"></div>
</header>
<div class="text-center error-message p-3 mb-2 bg-danger text-white" hidden> </div>
<div class="text-center success-message p-3 mb-2 bg-success text-white" hidden> </div>
<main hidden>
    <div class="container py-5">
        <div class="row d-flex mb-2 m-2">
            <h4 class="col" id="test-name">Test Name</h4>
            <button id="add-questions" type="button" class="btn" data-toggle="modal" data-target=".bd-example-modal-lg">
                <i class="fa fa-plus"></i></button>
        </div>
        <ul id="questions-list" class="list-group mb-2 d-flex">

        </ul>
        <div class="row m-1">
            <button id="save-test" class="col btn btn-success btn-block mt-2 mr-2" type="submit">Save</button>
            <button onclick="goBack()" class="col btn btn-secondary btn-block mt-2">Cancel</button>
        </div>
    </div>
    <div id="modal_test" class="modal fade bd-example-modal-lg" tabindex="-1" role="dialog"
         aria-labelledby="myLargeModalLabel" aria-hidden="true">
        <div class="container py-5 modal-dialog modal-lg">
            <div class="container py-5 modal-content">
                <form id="questions-checklist" class="align-items-center">

                    <div class="form-row m-1">
                        <button data-dismiss="modal" id="add-questions-button"
                                class="col btn btn-success btn-block mt-2 mr-2">Save
                        </button>
                        <button data-dismiss="modal" class="col btn btn-secondary btn-block mt-2">Cancel</button>
                    </div>
                </form>

            </div>
        </div>
        <template id="test-step-template" hidden>
            <li class="mb-2 d-flex list-group-item list-group-item-action" value="1" data-test-question-id="">
                <span class="col mt-2 question-title">Two</span>
                <div class="col-1 mt-2 question-weight-title">Weight:</div>
                <input class="col-1 mr-2 question-weight" type="number" min="0">
                <div class="col-2 mt-2">Type: <span class="question-type">Lesson</span></div>
                <button class="offset-1 mr-2 col-1 btn question-link"><i class="fa fa-arrow-right"></i></button>
                <button class="col-1 btn question-remove"><i class="fa fa-remove"></i></button>
            </li>
        </template>
        <template id="questions-checklist-item" hidden>
            <div class="offset-2 form-row d-flex m-2 form-check" id="-1">
                <input class="form-check-input" type="checkbox" value="">
                <label class="form-check-label">
                    Default checkbox
                </label>
            </div>
        </template>
    </div>
</main>

<script>
    const courseId = "[[${courseId}]]";
    const testId = "[[${testId}]]";
</script>
<script src="https://dev.harbour.space:8443/auth/js/keycloak.js"></script>
<script src="/js/util.js" defer></script>
<script src="/js/ManageQuestions.js" defer></script>
</body>
</html>
