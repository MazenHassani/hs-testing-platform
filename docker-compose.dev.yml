version: '3.5'

volumes:
  datavolume:
    driver: local


services:
  db:
    build:
      context: .
      dockerfile: Dockerfile-db
    image: harbourspace/private:testing-platform-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=YOUR_DATABASE_PASSWORD
      - POSTGRES_USER=YOUR_DATABASE_USERNAME
      - POSTGRES_DB=postgres
    volumes:
    - datavolume:/data

  testing-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: harbourspace/private:testing-platform
    restart: always
    ports:
      - "8081:8081"
    links:
      - db
    depends_on:
      - db

